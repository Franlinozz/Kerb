name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public copy carries no em dash
        run: pnpm check:copy
      - name: Public copy makes no unsupported claim
        run: pnpm check:claims
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test
        # Every suite runs offline against committed fixtures: none needs Postgres or a live RPC,
        # so nothing is skipped. The count is printed so a future skip cannot hide.
        run: |
          set -o pipefail
          pnpm -r --no-bail test 2>&1 | tee test.log
          echo "Skipped tests: $(grep -Eo '[0-9]+ skipped' test.log | awk '{s+=$1} END {print s+0}')"
      - name: Build the web app with the API unreachable
        # The public API is named but never reachable from CI; every page renders on request, so
        # the build must not depend on it.
        env:
          KERB_API_PUBLIC: https://api.usekerb.xyz
          KERB_API_INTERNAL: http://127.0.0.1:9
        run: pnpm --filter @kerb/web build

  sol:
    name: Solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (fork suites excluded, they need an X Layer RPC)
        working-directory: contracts
        run: forge test --no-match-contract Fork

  e2e:
    name: E2E (Playwright)
    # The whole suite against a production build, with the API replaced by recorded real responses
    # (apps/web/e2e/fixture-api.mjs replay): no network, every timestamp moved to "now".
    runs-on: ubuntu-latest
    env:
      KERB_API_INTERNAL: http://127.0.0.1:8799
      KERB_API_PUBLIC: http://127.0.0.1:8799
      KERB_WEB_URL: http://127.0.0.1:3301
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fixture API
        working-directory: apps/web
        run: |
          nohup node e2e/fixture-api.mjs replay > fixture-api.log 2>&1 &
          for i in $(seq 20); do curl -sf http://127.0.0.1:8799/health >/dev/null && break; sleep 0.5; done
      - run: pnpm --filter @kerb/web build
      - name: Serve the build
        working-directory: apps/web
        run: |
          nohup node node_modules/next/dist/bin/next start -p 3301 > next.log 2>&1 &
          for i in $(seq 40); do curl -sf -o /dev/null http://127.0.0.1:3301/ && break; sleep 0.5; done
      - name: Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: apps/web
        run: npx playwright test --workers=2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/test-results
            apps/web/next.log
            apps/web/fixture-api.log
          retention-days: 7
