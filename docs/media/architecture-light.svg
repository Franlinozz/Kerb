<text class="col" x="48" y="760">Explain · observe · alert (run beside the core, never in the posting path)</text>
<g class="box panel">
<rect x="48" y="776" width="290" height="94" rx="8"/>
<text class="title" x="64" y="804">kerb-attribution</text>
<text class="line" x="64" y="826">why each term moved: horizon,</text>
<text class="line" x="64" y="845">volatility, exit cost, caps</text>
</g>
<g class="box panel">
<rect x="350" y="776" width="290" height="94" rx="8"/>
<text class="title" x="366" y="804">kerb-indexer + API</text>
<text class="line" x="366" y="826">events to Postgres, 24 REST</text>
<text class="line" x="366" y="845">endpoints, free MCP server</text>
</g>
<g class="box panel">
<rect x="652" y="776" width="290" height="94" rx="8"/>
<text class="title" x="668" y="804">kerb-agents</text>
<text class="line" x="668" y="826">x402 on X Layer through the</text>
<text class="line" x="668" y="845">OKX facilitator, USDT0</text>
</g>
<g class="box panel">
<rect x="954" y="776" width="290" height="94" rx="8"/>
<text class="title" x="970" y="804">Market-Time Reports</text>
<text class="line" x="970" y="826">what the market clock did to</text>
<text class="line" x="970" y="845">real exit capacity, versioned</text>
</g>
<g class="box panel">
<rect x="1256" y="776" width="290" height="94" rx="8"/>
<text class="title" x="1272" y="804">Last Call alerts</text>
<text class="line" x="1272" y="826">browser notifications and</text>
<text class="line" x="1272" y="845">@KerbAlertsBot on Telegram</text>
</g>
<g class="chip"><rect x="48" y="904" width="146" height="30" rx="15"/><text x="60" y="924">Chain is canonical</text></g>
<g class="chip"><rect x="203.6" y="904" width="232" height="30" rx="15"/><text x="215.6" y="924">Postgres is a rebuildable view</text></g>
<g class="chip"><rect x="445.6" y="904" width="261" height="30" rx="15"/><text x="457.6" y="924">Bundles are the irreplaceable data</text></g>
<g class="chip"><rect x="716.4000000000001" y="904" width="196" height="30" rx="15"/><text x="728.4000000000001" y="924">No model near the numbers</text></g>
<g class="chip"><rect x="922.4000000000001" y="904" width="203" height="30" rx="15"/><text x="934.4000000000001" y="924">Unaudited · testnet credit</text></g>
