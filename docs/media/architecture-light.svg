<g transform="translate(48 40) scale(0.052)"><path class="brand-a" d="M263.4 47.3Q315.0 0.0 385.0 0.0L636.0 0.0Q658.0 0.0 641.7 14.8L390.9 242.0Q339.0 289.0 269.0 289.0L22.0 289.0Q0.0 289.0 16.2 274.1Z"/><path class="brand-b" d="M506.4 171.3Q558.0 124.0 628.0 124.0L832.0 124.0Q854.0 124.0 837.8 138.9L590.6 365.7Q539.0 413.0 469.0 413.0L265.0 413.0Q243.0 413.0 259.2 398.1Z"/></g>
<text class="head" x="100" y="62">Kerb · system architecture</text>
<text class="sub" x="48" y="96">One measured, deterministic term, posted on X Layer and read by a credit market, contracts, agents and code.</text>
<text class="col" x="48" y="150">1 · Sources</text>
<text class="col" x="400" y="150">2 · Measure and compute (off chain, recomputable)</text>
<text class="col" x="948" y="150">3 · Post (X Layer)</text>
<text class="col" x="1300" y="150">4 · Consumers</text>
<g class="box panel">
<rect x="48" y="172" width="290" height="94" rx="8"/>
<text class="title" x="64" y="200">X Layer pools</text>
<text class="line" x="64" y="222">10 xStocks Uniswap V3 pools</text>
<text class="line" x="64" y="241">slot0, liquidity, ticks, every minute</text>
</g>
<g class="box panel">
<rect x="48" y="284" width="290" height="94" rx="8"/>
<text class="title" x="64" y="312">OKX DEX aggregator</text>
<text class="line" x="64" y="334">sell quotes at fixed sizes</text>
<text class="line" x="64" y="353">cross-checks the tick-walk</text>
</g>
<g class="box panel">
<rect x="48" y="396" width="290" height="94" rx="8"/>
<text class="title" x="64" y="424">Reference prices</text>
<text class="line" x="64" y="446">xStocks issuer data, Yahoo as a</text>
<text class="line" x="64" y="465">second, independent check</text>
</g>
<g class="box panel">
<rect x="48" y="508" width="290" height="94" rx="8"/>
<text class="title" x="64" y="536">Exchange calendars</text>
<text class="line" x="64" y="558">XNYS · XNAS · ARCX · XHKG</text>
<text class="line" x="64" y="577">sessions, lunch, DST, holidays</text>
</g>
<g class="box core">
<rect x="400" y="172" width="490" height="94" rx="8"/>
<text class="tag" x="416" y="194">apps/collector</text>
<text class="title" x="416" y="218">kerb-collector → observation store</text>
<text class="line" x="416" y="240">Postgres, append-only (triggers reject UPDATE and DELETE)</text>
<text class="line" x="416" y="259">every row kept; bundles cut from it byte for byte</text>
</g>
<g class="box core">
<rect x="400" y="296" width="490" height="150" rx="8"/>
<text class="tag" x="416" y="318">apps/engine · no model, no floats</text>
<text class="title" x="416" y="342">KTS 0.2 engine (pure functions)</text>
<text class="line" x="416" y="364">Clock: regime and the next weakening, per asset</text>
<text class="line" x="416" y="383">Depth: C(1%) by tick-walk, the exit that is really there</text>
<text class="line" x="416" y="402">Mark: the lower of reference and pool, less a haircut</text>
<text class="line" x="416" y="421">Terms: Carry, Session Max, fixed LT, debt ceiling</text>
</g>
<g class="box core">
<rect x="400" y="476" width="490" height="94" rx="8"/>
<text class="tag" x="416" y="498">published by the API</text>
<text class="title" x="416" y="522">Input bundle</text>
<text class="line" x="416" y="544">canonical JSON, hashed; anyone recomputes the same</text>
<text class="line" x="416" y="563">report byte for byte (kerb verify &lt;hash&gt;)</text>
</g>
<g class="box core">
<rect x="400" y="600" width="490" height="94" rx="8"/>
<text class="tag" x="416" y="622">apps/attester</text>
<text class="title" x="416" y="646">kerb-attester</text>
<text class="line" x="416" y="668">guardrails (tighten fast, loosen slow) · EIP-712 sign</text>
<text class="line" x="416" y="687">post with Builder Code kt0hl6xyhlx8xmt (ERC-8021)</text>
</g>
<g class="box chain">
<rect x="948" y="172" width="300" height="214" rx="8"/>
<text class="tag" x="964" y="194">risk plane · real xStocks</text>
<text class="title" x="964" y="218">X Layer mainnet · 196</text>
<text class="line" x="964" y="240">KerbTerms: signed terms + inputs hash</text>
<text class="line" x="964" y="259">KerbClock: calendars and regimes</text>
<text class="line" x="964" y="278">KerbQuote: max borrow, cure</text>
<text class="line" x="964" y="297">   deadline, usability in one call</text>
<text class="line" x="964" y="316">KerbMarkFeed × 10: Credit Mark</text>
<text class="line" x="964" y="335">   as a Chainlink-shaped feed</text>
<text class="line" x="964" y="354">Sourcify exact match, all 34</text>
</g>
<g class="box chain2">
<rect x="948" y="468" width="300" height="226" rx="8"/>
<text class="tag" x="964" y="490">credit plane · mirror terms</text>
<text class="title" x="964" y="514">X Layer testnet · 1952</text>
<text class="line" x="964" y="536">KerbCredit: Carry, Session Max,</text>
<text class="line" x="964" y="555">   Last Call, public cure</text>
<text class="line" x="964" y="574">KerbMirror: mirror collateral</text>
<text class="line" x="964" y="593">mUSDG loan asset · demo clock</text>
<text class="line" x="964" y="612">kerb-demo-keeper: a standing</text>
<text class="line" x="964" y="631">   position to cure every cycle</text>
</g>
<g class="box consumer">
<rect x="1300" y="172" width="252" height="88" rx="8"/>
<text class="title" x="1316" y="200">Kerb Credit</text>
<text class="line" x="1316" y="222">borrow, Last Call, cure on testnet</text>
</g>
<g class="box consumer">
<rect x="1300" y="278" width="252" height="88" rx="8"/>
<text class="title" x="1316" y="306">Any contract</text>
<text class="line" x="1316" y="328">KerbQuote and Credit Mark feeds</text>
</g>
<g class="box consumer">
<rect x="1300" y="384" width="252" height="88" rx="8"/>
<text class="title" x="1316" y="412">Agents</text>
<text class="line" x="1316" y="434">x402 paid checks · MCP · OKX.AI</text>
</g>
<g class="box consumer">
<rect x="1300" y="490" width="252" height="88" rx="8"/>
<text class="title" x="1316" y="518">Developers</text>
<text class="line" x="1316" y="540">REST (no key) · npm i kerb-sdk</text>
</g>
<g class="box consumer">
<rect x="1300" y="596" width="252" height="88" rx="8"/>
<text class="title" x="1316" y="624">People</text>
<text class="line" x="1316" y="646">usekerb.xyz · Telegram alerts</text>
</g>
