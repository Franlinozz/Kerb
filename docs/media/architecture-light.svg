<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" role="img" aria-labelledby="t d">
<title id="t">Kerb architecture</title>
<desc id="d">Market data flows from X Layer pools, OKX DEX quotes, reference prices and exchange calendars into the Kerb collector and an append-only store. The deterministic KTS 0.2 engine turns it into terms and an input bundle; the attester signs and posts them to KerbTerms on X Layer mainnet with the Builder Code. A relay mirrors the terms to X Layer testnet, where Kerb Credit lends against them. Contracts, agents over x402 and MCP, and developers over REST and the SDK read the same terms.</desc>
